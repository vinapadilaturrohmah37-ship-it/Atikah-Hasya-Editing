
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOTO ART STUDIO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HALAMAN LOGIN -->
  <section id="loginPage" class="login-page">
    <div class="login-box">
      <div class="logo">✦</div>
      <h1>PHOTO ART</h1>
      <p class="subtitle">STUDIO</p>
      <p class="description">Create your own masterpiece</p>

      <form id="loginForm">
        <input
          type="text"
          id="username"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">LOGIN NOW</button>
      </form>

      <p id="loginMessage"></p>
      <p class="login-footer">PHOTO ART STUDIO © 2026</p>
    </div>
  </section>

  <!-- HALAMAN EDITOR -->
  <section id="editorPage" class="editor-page hidden">

    <header>
      <h2>✦ PHOTO ART STUDIO</h2>
      <button id="logoutBtn" class="logout">Logout</button>
    </header>

    <main class="container">

      <div class="welcome">
        <h1>Photo Editor</h1>
        <p>Edit your photos with creativity.</p>
      </div>

      <div class="upload-box">
        <label for="imageInput" class="upload-button">
          + Upload Your Photo
        </label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="preview-box">
        <canvas id="canvas"></canvas>
        <p id="emptyMessage">Your photo will appear here</p>
      </div>

      <div class="tools">
        <h3>EDITING TOOLS</h3>

        <label>Brightness</label>
        <input type="range" id="brightness"
          min="0" max="200" value="100">

        <label>Contrast</label>
        <input type="range" id="contrast"
          min="0" max="200" value="100">

        <label>Saturation</label>
        <input type="range" id="saturation"
          min="0" max="200" value="100">

        <label>Grayscale</label>
        <input type="range" id="grayscale"
          min="0" max="100" value="0">

        <label>Sepia</label>
        <input type="range" id="sepia"
          min="0" max="100" value="0">

        <label>Blur</label>
        <input type="range" id="blur"
          min="0" max="10" value="0">

        <div class="actions">
          <button id="rotateBtn">↻ Rotate</button>
          <button id="flipBtn">↔ Flip</button>
          <button id="resetBtn">Reset</button>
          <button id="downloadBtn">Download Photo</button>
        </div>
      </div>

    </main>
  </section>

  <script src="script.js"></script>
</body>
</html>
